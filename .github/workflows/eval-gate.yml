name: Agent Eval Gate

# Sync the repo configuration to the platform, then score the agent, on every
# pull request. config/agent.yaml is the single source of truth; only the API
# token comes from repository secrets.
on:
  pull_request:
  workflow_dispatch:

jobs:
  eval-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Sync configuration
        run: python sync_config.py
        env:
          DIGITALOCEAN_API_TOKEN: ${{ secrets.DIGITALOCEAN_API_TOKEN }}

      - name: Run the evaluation gate
        run: python eval_driver.py
        env:
          DIGITALOCEAN_API_TOKEN: ${{ secrets.DIGITALOCEAN_API_TOKEN }}