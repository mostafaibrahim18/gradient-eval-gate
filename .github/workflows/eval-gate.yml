name: Agent Eval Gate

# Sync the repo configuration to the platform, then score the agent, on every
# pull request. Because the config lives in Git, the change under review is the
# change the gate evaluates.
on:
  pull_request:
  workflow_dispatch:

jobs:
  eval-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      # Push config/agent.yaml (instruction, model, threshold) to the platform
      # before scoring, so the evaluation reflects the pull request.
      - name: Sync configuration
        run: python sync_config.py
        env:
          DIGITALOCEAN_API_TOKEN: ${{ secrets.DIGITALOCEAN_API_TOKEN }}

      - name: Run the evaluation gate
        run: python eval_driver.py
        env:
          DIGITALOCEAN_API_TOKEN: ${{ secrets.DIGITALOCEAN_API_TOKEN }}
          TEST_CASE_UUID: ${{ vars.TEST_CASE_UUID }}
          AGENT_UUID: ${{ vars.AGENT_UUID }}
          STAR_THRESHOLD: ${{ vars.STAR_THRESHOLD }}