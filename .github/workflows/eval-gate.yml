name: Agent Eval Gate

# Run the evaluation gate on every pull request, and allow manual runs.
on:
  pull_request:
  workflow_dispatch:

jobs:
  eval-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the evaluation gate
        env:
          # Secret: the DigitalOcean personal access token.
          DIGITALOCEAN_API_TOKEN: ${{ secrets.DIGITALOCEAN_API_TOKEN }}
          # Variables: not sensitive, kept out of the code so the same
          # workflow drops onto any Gradient agent without edits.
          TEST_CASE_UUID: ${{ vars.TEST_CASE_UUID }}
          AGENT_UUID: ${{ vars.AGENT_UUID }}
          STAR_THRESHOLD: ${{ vars.STAR_THRESHOLD }}
        run: python eval_driver.py