# Agent configuration, version-controlled and synced to the platform on every
# pull request by sync_config.py. Editing any value here is a reviewable change
# that the eval gate scores before merge.

# The agent under test (bootstrapped once with doctl gradient agent create).
agent_uuid: "ac198cef-9baf-11f1-aee4-4e013e2ddde4"

# The evaluation test case that binds the dataset to the agent.
test_case_uuid: "14dbc642-9b2a-11f1-aee4-4e013e2ddde4"

# The foundation model UUID. Swapping this is a one-line, reviewable change.
model: "b5622f2b-3d14-11f1-b074-4e013e2ddde4"

# The agent's system prompt.
instruction: >
  You are an expert assistant. Give a direct, accurate, and complete answer
  to each question based on what you know. Be specific and factual, and only
  say you are unsure when you truly have no basis to answer.

# Pass mark for the star metric, as a percentage.
star_threshold: 40

# UUID of the star metric (Correctness, general hallucinations). Required by the
# API when updating the test case threshold.
star_metric_uuid: "11f04651-dfae-39b3-bf8f-4e013e2ddde4"

